# ==============================================================================
# Healthcare Patient Data Protection System - Core Configuration
# ==============================================================================

spring.application.name=patient-data-protection

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ==============================================================================
# Production Environment Profile (application-prod.properties)
# ==============================================================================

# Database Connection (MySQL 8.0) - Strictly via Environment Variables
# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# CORS
app.cors.allowed-origins=${FRONTEND_URL}

# JWT
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION:900000}
app.security.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION:604800000}

# Encryption
app.encryption.master-key=${ENCRYPTION_MASTER_KEY}
app.encryption.current-key-version=${KEY_VERSION:v1}

# Production Logging
logging.level.root=WARN
logging.level.com.backend.protection=INFO

# ==============================================================================

# Email / SMTP Configuration (Gmail â\u0080\u0094 app password required)

# ==============================================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_ID}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com



spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Application Email Settings

app.email.from=${MAIL_ID}

app.email.from-name=E-Care Digital

app.email.enabled=true
